name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore FirstProject.slnx

      - name: Build
        run: dotnet build FirstProject.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test FirstProject.slnx --no-build --configuration Release --verbosity normal
